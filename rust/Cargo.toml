[package]
name = "vr_game"
version = "0.1.0"
edition = "2021"


[lib]
# Compile this crate to a dynamic C library so it can be used by godot.
crate-type = ["cdylib"]

[dependencies]
cfg-if = "1.0.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

[dependencies.godot]
git = "https://github.com/godot-rust/gdext"
branch = "master"
features = ["experimental-wasm", "lazy-function-tables"]
