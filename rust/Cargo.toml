[package]
name = "vr_game"
version = "0.1.0"
edition = "2021"


[lib]
# Compile this crate to a dynamic C library so it can be used by godot.
crate-type = ["cdylib"]

[dependencies]
cfg-if = "1.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
godot = { version = "=0.2.4", features = [
  "experimental-wasm",
  "lazy-function-tables",
] }
humantime = "2.1.0"

