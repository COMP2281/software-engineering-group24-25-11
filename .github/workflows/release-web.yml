name: Deploy website

on:
  push:
    tags:
      - '*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm just godot git python unzip clang npm github-cli zip

      - name: Restore cache (before setup)
        id: cache-restore
        uses: actions/cache@v3
        with:
          path: |
            ./.deps
            ~/.local/share/godot/export_templates
          key: setup-cache-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: |
            setup-cache-${{ runner.os }}-

      - name: Run setup
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: just setup-ci-cd

      - name: Save cache (after setup)
        id: cache-save
        uses: actions/cache@v3
        with:
          path: |
            ./.deps
            ~/.local/share/godot/export_templates
          key: setup-cache-${{ runner.os }}-${{ hashFiles('justfile') }}

      - name: Export Web
        run: |
          just release-web
          cp -r web_assets/* target/web

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: |
          export NETLIFY_AUTH_TOKEN=${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify deploy --dir=target/web --prod --site=${{ secrets.NETLIFY_SITE_ID }}

      - name: Zip Web Export
        run: |
          cd target/web
          zip -r web-export.zip ./*
          mv web-export.zip ../..

      - name: Create GitHub Release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "Release for ${{ github.ref_name }}" || echo "Release already exists"

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} web-export.zip
